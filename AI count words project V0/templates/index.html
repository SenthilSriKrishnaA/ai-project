<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Document Search | Word Counter</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    body {

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #334155
            );

        padding: 20px;
    }


    .container {

        width: 100%;

        max-width: 700px;

        background: white;

        border-radius: 20px;

        padding: 40px;

        box-shadow:
            0 25px 60px
            rgba(0, 0, 0, 0.3);
    }


    /* HEADER */

    .header {

        text-align: center;

        margin-bottom: 35px;
    }


    .logo {

        width: 60px;

        height: 60px;

        margin: auto;

        margin-bottom: 15px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 15px;

        font-size: 28px;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

        color: white;
    }


    h1 {

        font-size: 28px;

        color: #0f172a;

        margin-bottom: 10px;
    }


    .subtitle {

        color: #64748b;

        font-size: 15px;
    }


    /* SECTION TITLE */

    .section-title {

        font-size: 15px;

        font-weight: 600;

        color: #334155;

        margin-bottom: 10px;
    }


    /* FILE UPLOAD */

    .upload-area {

        border:
            2px dashed
            #cbd5e1;

        border-radius: 14px;

        padding: 35px 20px;

        text-align: center;

        cursor: pointer;

        transition: 0.3s;

        background: #f8fafc;

        margin-bottom: 25px;
    }


    .upload-area:hover {

        border-color: #2563eb;

        background: #eff6ff;
    }


    .upload-area.dragging {

        border-color: #2563eb;

        background: #dbeafe;
    }


    .upload-icon {

        font-size: 40px;

        margin-bottom: 10px;
    }


    .upload-text {

        font-size: 16px;

        font-weight: 600;

        color: #334155;
    }


    .upload-small-text {

        font-size: 13px;

        color: #94a3b8;

        margin-top: 8px;
    }


    #file {

        display: none;
    }


    /* FILE INFO */

    .file-info {

        display: none;

        align-items: center;

        justify-content: space-between;

        padding: 12px 15px;

        background: #eff6ff;

        border-radius: 10px;

        margin-bottom: 25px;

        color: #1e40af;
    }


    .file-name {

        overflow: hidden;

        white-space: nowrap;

        text-overflow: ellipsis;

        max-width: 500px;

        font-size: 14px;

        font-weight: 500;
    }


    .remove-file {

        border: none;

        background: none;

        cursor: pointer;

        font-size: 18px;

        color: #ef4444;
    }


    /* SEARCH INPUT */

    .input-container {

        position: relative;

        margin-bottom: 25px;
    }


    .search-input {

        width: 100%;

        padding: 16px;

        border:
            1px solid
            #cbd5e1;

        border-radius: 12px;

        outline: none;

        font-size: 16px;

        transition: 0.3s;
    }


    .search-input:focus {

        border-color: #2563eb;

        box-shadow:
            0 0 0 4px
            rgba(37, 99, 235, 0.1);
    }


    /* BUTTON */

    .search-button {

        width: 100%;

        border: none;

        padding: 16px;

        border-radius: 12px;

        font-size: 16px;

        font-weight: 600;

        color: white;

        cursor: pointer;

        background:
            linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

        transition: 0.3s;
    }


    .search-button:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 10px 25px
            rgba(37, 99, 235, 0.3);
    }


    .search-button:disabled {

        opacity: 0.6;

        cursor: not-allowed;

        transform: none;
    }


    /* RESULT */

    .result {

        display: none;

        margin-top: 25px;

        padding: 20px;

        border-radius: 12px;

        text-align: center;
    }


    .result.success {

        display: block;

        background: #ecfdf5;

        border:
            1px solid
            #86efac;

        color: #166534;
    }


    .result.not-found {

        display: block;

        background: #fef2f2;

        border:
            1px solid
            #fecaca;

        color: #991b1b;
    }


    .result.loading {

        display: block;

        background: #eff6ff;

        border:
            1px solid
            #bfdbfe;

        color: #1d4ed8;
    }


    .result-icon {

        font-size: 30px;

        margin-bottom: 10px;
    }


    .result-title {

        font-size: 18px;

        font-weight: 700;

        margin-bottom: 5px;
    }


    .result-text {

        font-size: 15px;
    }


    /* FOOTER */

    .footer {

        text-align: center;

        margin-top: 30px;

        color: #94a3b8;

        font-size: 12px;
    }


    /* MOBILE */

    @media (max-width: 600px) {

        .container {

            padding: 25px;
        }


        h1 {

            font-size: 23px;
        }


        .file-name {

            max-width: 220px;
        }

    }


    /* AI DOCUMENT SUMMARY STYLES */

    .ai-divider {
        margin: 30px 0 25px 0;
        border: 0;
        height: 1px;
        background: linear-gradient(to right, transparent, #cbd5e1, transparent);
    }

    .ai-button {
        width: 100%;
        border: none;
        padding: 16px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        color: white;
        cursor: pointer;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        transition: 0.3s;
    }

    .ai-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
    }

    .ai-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .ai-result {
        display: none;
        margin-top: 20px;
        padding: 20px;
        border-radius: 12px;
        text-align: left;
    }

    .ai-result.loading {
        display: block;
        background: #f5f3ff;
        border: 1px solid #ddd6fe;
        color: #5b21b6;
        text-align: center;
    }

    .ai-result.error {
        display: block;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        text-align: center;
    }

    .ai-result.success {
        display: block;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        color: #1e293b;
    }

    .ai-result-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 12px;
        color: #4338ca;
    }

    .ai-result-content {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
        line-height: 1.65;
        color: #334155;
    }

</style>

</head>

<body>

<div class="container">
<!-- HEADER -->

<div class="header">

    <div class="logo">
        📄
    </div>


    <h1>
        Document Search
    </h1>


    <p class="subtitle">

        Upload a document and instantly search
        for any word or text.

    </p>

</div>



<!-- FILE UPLOAD -->

<p class="section-title">
    Upload Document
</p>


<div
    class="upload-area"
    id="uploadArea"
>

    <div class="upload-icon">
        ☁️
    </div>


    <p class="upload-text">

        Click or drag your file here

    </p>


    <p class="upload-small-text">

        PDF, DOCX, XLSX, XLS or TXT

    </p>


    <input
        type="file"
        id="file"
        accept=".pdf,.docx,.xlsx,.xls,.txt"
    >

</div>



<!-- FILE INFORMATION -->

<div
    class="file-info"
    id="fileInfo"
>

    <span
        class="file-name"
        id="fileName"
    >
    </span>


    <button
        class="remove-file"
        onclick="removeFile()"
    >
        ✕
    </button>

</div>



<!-- SEARCH INPUT -->

<p class="section-title">
    Search Text
</p>


<div class="input-container">

    <input
        type="text"
        class="search-input"
        id="searchWord"
        placeholder="Enter a word or phrase to search..."
    >

</div>



<!-- SEARCH BUTTON -->

<button
    class="search-button"
    id="searchButton"
    onclick="searchFile()"
>

    🔍 Search Document

</button>



<!-- RESULT -->

<div
    class="result"
    id="result"
>

    <div
        class="result-icon"
        id="resultIcon"
    >
    </div>


    <div
        class="result-title"
        id="resultTitle"
    >
    </div>


    <div
        class="result-text"
        id="resultText"
    >
    </div>

</div>



<!-- AI DOCUMENT SUMMARY SECTION -->

<hr class="ai-divider">

<p class="section-title">
    🤖 AI Document Summary
</p>

<button
    class="ai-button"
    id="aiButton"
    onclick="generateAiSummary()"
    type="button"
>
    ✨ Generate AI Summary
</button>

<div
    class="ai-result"
    id="aiResult"
>
    <div class="ai-result-header" id="aiResultHeader">
        <span id="aiResultIcon">🤖</span>
        <span id="aiResultTitle">AI Document Summary</span>
    </div>
    <div
        class="ai-result-content"
        id="aiResultContent"
    >
    </div>
</div>



<!-- FOOTER -->

<div class="footer">

    Secure document text search tool

</div>

</div>

<script>


    const uploadArea =
        document.getElementById(
            "uploadArea"
        );


    const fileInput =
        document.getElementById(
            "file"
        );


    const fileInfo =
        document.getElementById(
            "fileInfo"
        );


    const fileName =
        document.getElementById(
            "fileName"
        );


    const result =
        document.getElementById(
            "result"
        );


    const searchButton =
        document.getElementById(
            "searchButton"
        );



    /* CLICK UPLOAD AREA */

    uploadArea.addEventListener(
        "click",
        () => {

            fileInput.click();

        }
    );



    /* FILE SELECTED */

    fileInput.addEventListener(
        "change",
        () => {

            showFile();

        }
    );



    /* DRAG OVER */

    uploadArea.addEventListener(
        "dragover",
        (event) => {

            event.preventDefault();

            uploadArea.classList.add(
                "dragging"
            );

        }
    );



    /* DRAG LEAVE */

    uploadArea.addEventListener(
        "dragleave",
        () => {

            uploadArea.classList.remove(
                "dragging"
            );

        }
    );



    /* DROP FILE */

    uploadArea.addEventListener(
        "drop",
        (event) => {

            event.preventDefault();

            uploadArea.classList.remove(
                "dragging"
            );


            fileInput.files =
                event.dataTransfer.files;


            showFile();

        }
    );



    /* SHOW FILE */

    function showFile() {

        const file =
            fileInput.files[0];


        if (!file) {

            return;

        }


        fileName.innerText =
            "📎 " + file.name;


        fileInfo.style.display =
            "flex";


        uploadArea.style.display =
            "none";

    }



    /* REMOVE FILE */

    function removeFile() {

        fileInput.value = "";


        fileInfo.style.display =
            "none";


        uploadArea.style.display =
            "block";


        result.style.display =
            "none";


        const aiResult =
            document.getElementById(
                "aiResult"
            );

        if (aiResult) {

            aiResult.style.display =
                "none";

        }

    }



    /* SEARCH FILE */

    async function searchFile() {


        const file =
            fileInput.files[0];


        const searchWord =
            document
                .getElementById(
                    "searchWord"
                )
                .value
                .trim();



        /* VALIDATION */

        if (!file) {

            showResult(
                "not-found",
                "⚠️",
                "No File Selected",
                "Please upload a document first."
            );

            return;

        }



        if (!searchWord) {

            showResult(
                "not-found",
                "⚠️",
                "No Search Text",
                "Please enter a word or phrase."
            );

            return;

        }



        /* LOADING */

        searchButton.disabled =
            true;


        searchButton.innerText =
            "Searching...";


        showResult(
            "loading",
            "⏳",
            "Searching Document",
            "Please wait while we scan your file..."
        );



        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "search_word",
            searchWord
        );



        try {


            const response =
                await fetch(
                    "/search",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();



            if (data.found) {


                showResult(
                    "success",
                    "✓",
                    "Text Found",
                    `"${searchWord}" appears ${data.count} time(s) in the document.`
                );

            }


            else {


                showResult(
                    "not-found",
                    "✕",
                    "Not Found",
                    `"${searchWord}" does not appear in this document.`
                );

            }


        }


        catch (error) {


            showResult(
                "not-found",
                "⚠️",
                "Error",
                "Something went wrong. Please try again."
            );


        }


        finally {


            searchButton.disabled =
                false;


            searchButton.innerText =
                "🔍 Search Document";


        }

    }



    /* SHOW RESULT */

    function showResult(
        type,
        icon,
        title,
        text
    ) {


        result.className =
            "result " + type;


        document
            .getElementById(
                "resultIcon"
            )
            .innerText =
            icon;


        document
            .getElementById(
                "resultTitle"
            )
            .innerText =
            title;


        document
            .getElementById(
                "resultText"
            )
            .innerText =
            text;

    }



    /* GENERATE AI SUMMARY */

    async function generateAiSummary() {

        const file =
            fileInput.files[0];

        const aiButton =
            document.getElementById(
                "aiButton"
            );


        /* VALIDATION: Check if document is selected */
        if (!file) {

            showAiResult(
                "error",
                "⚠️",
                "No Document Selected",
                "Please upload a document first."
            );

            return;

        }


        /* LOADING STATE */
        aiButton.disabled =
            true;

        aiButton.innerText =
            "⏳ Generating AI Summary...";

        showAiResult(
            "loading",
            "⏳",
            "Generating AI Summary",
            "Reading document and generating AI summary... Please wait."
        );


        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );


        try {

            const response =
                await fetch(
                    "/summarize",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const data =
                await response.json();


            if (data.success) {

                showAiResult(
                    "success",
                    "🤖",
                    "AI Document Summary",
                    data.summary
                );

            }

            else {

                showAiResult(
                    "error",
                    "⚠️",
                    "AI Summary Notice",
                    data.message || "Unable to generate summary. Please try again."
                );

            }

        }

        catch (error) {

            showAiResult(
                "error",
                "⚠️",
                "Error",
                "Unable to generate summary. Please try again."
            );

        }

        finally {

            aiButton.disabled =
                false;

            aiButton.innerText =
                "✨ Generate AI Summary";

        }

    }



    /* SHOW AI RESULT */

    function showAiResult(
        type,
        icon,
        title,
        text
    ) {

        const aiResult =
            document.getElementById(
                "aiResult"
            );

        const aiResultIcon =
            document.getElementById(
                "aiResultIcon"
            );

        const aiResultTitle =
            document.getElementById(
                "aiResultTitle"
            );

        const aiResultContent =
            document.getElementById(
                "aiResultContent"
            );


        aiResult.className =
            "ai-result " + type;

        aiResultIcon.innerText =
            icon;

        aiResultTitle.innerText =
            title;

        aiResultContent.innerText =
            text;

        aiResult.style.display =
            "block";

    }


</script>

</body>

</html>
